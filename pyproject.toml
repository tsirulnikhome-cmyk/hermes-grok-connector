[project]
name = "hermes-grok-connector"
version = "0.3.0"
description = "Your own Hermes agent and lasting memory inside Grok and your Tesla: one private connector per driver, agent-first and silent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yevgeni Tsirulnik" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "pyyaml>=6",
    "uvicorn>=0.30",
]
keywords = ["grok", "mcp", "hermes-agent", "tesla", "memory", "voice-assistant", "connector"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Home Automation",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
hermes-grok-connector = "hermes_grok_connector.cli:main"

[project.urls]
Homepage = "https://github.com/tsirulnikhome-cmyk/hermes-grok-connector"
Issues = "https://github.com/tsirulnikhome-cmyk/hermes-grok-connector/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_grok_connector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
